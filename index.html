/* Gesamter Startbildschirm */
.wallet-background {
    position: fixed;
    inset: 0;
    z-index: 100;
    background:
        radial-gradient(
            circle at center,
            #292929 0%,
            #0b0b0b 50%,
            #000000 100%
        );
    transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
}

/* Shimmer-Effects*/
.digital-card-shimmer::after {
    content: "";
    position: absolute;
    z-index: 20;
    top: 0;
    left: -100%;
    width: 45%;
    height: 100%;

    background: linear-gradient(
        110deg,
        transparent,
        rgba(255, 255, 255, 0.55),
        transparent
    );

    transform: skewX(-20deg);
    pointer-events: none;
}

#headlightBeam {
    position: absolute;
    z-index: 5;

    left: 0;
    top: 0;

    width: 0;
    height: 90px;

    pointer-events: none;
    transform-origin: left center;

    /*
     * EXPEIRMENTAL // Alles was mich Lichtkegel/Scheinwerfer betrifft, ist noch in der Testphase!!
     * Schmal am Scheinwerfer, breit am Profilbild.
     */
    clip-path: polygon(
        0 45%,
        100% 0,
        100% 100%,
        0 55%
    );

    background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.7) 0%,
        rgba(255, 255, 255, 0.3) 25%,
        rgba(255, 255, 255, 0.1) 65%,
        transparent 100%
    );

    filter: blur(5px);

    opacity: 0;
    visibility: hidden;
}

/* Zusätzlicher weicher Rand um den Lichtkegel */
#headlightBeam::after {
    content: "";
    position: absolute;
    inset: 0;

    background: inherit;
    filter: blur(14px);
    opacity: 0.5;
}

/* Lichtkegel richtung Profilbild */
.profile-light-target::before {
    content: "";
    position: absolute;
    z-index: 5;

    inset: -7px;
    border-radius: 9999px;

    background: radial-gradient(
        circle at left center,
        rgba(255, 255, 255, 0.75) 0%,
        rgba(255, 255, 255, 0.3) 18%,
        rgba(255, 255, 255, 0.08) 38%,
        transparent 65%
    );

    filter: blur(4px);

    opacity: 0;
    pointer-events: none;
}
#profil.light-active #headlightBeam {
    visibility: visible;
    animation: illuminateBeam 2.5s ease-out forwards;
}

#profil.light-active .profile-light-target::before {
    animation: illuminateProfile 2.5s ease-out forwards;
}

@keyframes illuminateBeam {
    0% {
        opacity: 0;
        filter: blur(1px);
    }

    20% {
        opacity: 0.85;
        filter: blur(3px);
    }

    65% {
        opacity: 0.45;
        filter: blur(7px);
    }

    100% {
        opacity: 0;
        filter: blur(12px);
        visibility: hidden;
    }
}

@keyframes illuminateProfile {
    0%,
    25% {
        opacity: 0;
    }

    45% {
        opacity: 1;
    }

    75% {
        opacity: 0.65;
    }

    100% {
        opacity: 0;
    }
}
.vcard-content.visible .digital-card-text {
    animation: brightenCardText 0.6s ease-out 1.6s forwards;
}

@keyframes brightenCardText {
    from {
        color: rgba(255, 255, 255, 0.35);
        text-shadow: 0 0 0 rgba(255, 255, 255, 0);
    }

    to {
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
    }
}

.availability-bubble {
    position: absolute;
    z-index: 100;

    left: calc(100% + 16px);
    top: 4px;

    width: max-content;
    max-width: 210px;
    padding: 10px 14px;

    color: rgba(255, 255, 255, 0.9);
    background: rgba(10, 10, 10, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 14px;

    font-size: 12px;
    line-height: 1.4;
    text-transform: none;
    letter-spacing: normal;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.5),
        0 0 15px rgba(255, 255, 255, 0.08);

    opacity: 0;
    visibility: hidden;
    transform: translateX(-8px) scale(0.95);
    transform-origin: left center;

    transition:
        opacity 300ms ease,
        transform 300ms ease,
        visibility 300ms;

    pointer-events: none;

    

  

}

/* Pfeil in Richtung Profilbild */
.availability-bubble::before {
    content: "";
    position: absolute;

    left: -7px;
    top: 18px;

    width: 12px;
    height: 12px;

    background: rgba(10, 10, 10, 0.95);
    border-left: 1px solid rgba(255, 255, 255, 0.25);
    border-bottom: 1px solid rgba(255, 255, 255, 0.25);

    transform: rotate(45deg);
}

.availability-bubble.visible {
    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
}

.vcard-content.visible .digital-card-shimmer {
    animation: brightenCardBadge 0.6s ease-out 1.6s forwards;
}

@keyframes brightenCardBadge {
    from {
        background-color: rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 255, 255, 0.15);
    }

    to {
        background-color: rgba(0, 0, 0, 0.4);
        border-color: rgba(255, 255, 255, 0.4);

        box-shadow:
        0 0 10px rgba(255, 255, 255, 0.08),
        inset 0 0 8px rgba(218, 143, 143, 0.04);
    }
}

/* Once Card is visible */
.vcard-content.visible .digital-card-shimmer::after {
    animation: shimmer 1.2s ease-out 0.4s forwards;
}

@keyframes shimmer {
    from {
        left: -100%;
    }

    to {
        left: 150%;
    }
}
@media (prefers-reduced-motion: reduce) {
    .vcard-content.visible .digital-card-shimmer::after {
        animation: none;
    }
}
.vcard-content {
    --card-scale: 0.28;
    --card-position: 80px;
    --card-opacity: 0.65;

    position: relative;
    z-index: 101;

    opacity: var(--card-opacity);

    transform:
        translateY(var(--card-position))
        scale(var(--card-scale));

    transform-origin: center center;
    pointer-events: none;

    transition:
        opacity 0.8s ease,
        transform 1s cubic-bezier(0.16, 1, 0.3, 1);

    will-change: transform, opacity;

   
}


.vcard-content.visible {
    --card-scale: 1;
    --card-position: 0px;
    --card-opacity: 1;
    

    pointer-events: auto;
}


/* wallet-cover */
.wallet-cover {
    position: fixed;
    inset: 0;
    z-index: 102;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    cursor: grab;
    user-select: none;
    touch-action: none;

    background:
        linear-gradient(
            145deg,
            #1f1f1f 0%,

            #000000 100%
        );

    border-top: 1px solid rgba(255, 255, 255, 0.15);

    box-shadow:
        0 4px 70px rgba(0, 0, 0, 0.8);

    transform: translateY(0);
    will-change: transform;

}

.wallet-cover:active {
    cursor: grabbing;
}

/* Inhalt der Schablone */
.wallet-cover-content {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding-bottom: 45px;
}

.wallet-title {
    margin-bottom: 35px;
    color: rgba(255, 255, 255, 0.25);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
}

.drag-indicator {
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 8px;
    color: rgba(255, 255, 255, 0.65);
    font-size: 10px;
    font-weight: 700;

.drag-arrow {

.drag-handle {

/* Eigentliche VCard zunächst verstecken */

/* Animation nach vollständigem Öffnen */
.wallet-cover.opened {

.wallet-background.finished {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.wallet-cover.finished {
    visibility: hidden;
    pointer-events: none;
}

/* Eigentliche VCard anzeigen */

@keyframes dragHint {
    0%,
    100% {
        opacity: 0.4;
        transform: translateY(4px);

    50% {
        opacity: 1;
        transform: translateY(-7px);
    }
}

@media (prefers-reduced-motion: reduce) {

    .wallet-cover,
    .wallet-intro,

}

        }

    <script>
    const walletBackground =
        document.getElementById("walletBackground");

    const walletCover =
        document.getElementById("walletCover");

    const vcardContent =
        document.getElementById("vcardContent");

    let isDragging = false;
    let isOpened = false;

    let startPositionY = 0;
    let currentDragDistance = 0;

    const requiredDragDistance = 180;
    const maximumDragDistance = 350;

    walletCover.addEventListener("pointerdown", function (event) {
        if (isOpened) {
            return;
        }

        isDragging = true;
        startPositionY = event.clientY;
        currentDragDistance = 0;

        walletCover.setPointerCapture(event.pointerId);

        walletCover.style.transition = "none";
        vcardContent.style.transition = "none";
    });

walletCover.addEventListener("pointermove", function (event) {
    if (!isDragging || isOpened) {
        return;
    }

    const dragDistance =
        startPositionY - event.clientY;

    currentDragDistance = Math.max(
        0,
        Math.min(dragDistance, maximumDragDistance)
    );

    /*
     * Nur die Schablone bewegt sich.
     * Die VCard bleibt unverändert klein.
     */
    walletCover.style.transform =
        `translateY(-${currentDragDistance}px)`;
});

    walletCover.addEventListener(
        "pointerup",
        finishDragging
    );

    walletCover.addEventListener(
        "pointercancel",
        finishDragging
    );

    function finishDragging(event) {
        if (!isDragging || isOpened) {
            return;
        }

        isDragging = false;

        if (walletCover.hasPointerCapture(event.pointerId)) {
            walletCover.releasePointerCapture(event.pointerId);
        }

        if (currentDragDistance >= requiredDragDistance) {
            openVCard();
        } else {
            resetWallet();
        }
    }


   function resetWallet() {
    walletCover.style.transition =
        "transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)";

    vcardContent.style.transition =
        "opacity 0.45s ease, " +
        "transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)";

    walletCover.style.transform = "translateY(0)";

    vcardContent.style.setProperty(
        "--card-scale",
        "0.28"
    );

    vcardContent.style.setProperty(
        "--card-position",
        "80px"
    );

    vcardContent.style.setProperty(
        "--card-opacity",
        "0.65"
    );

    currentDragDistance = 0;
}

   function openVCard() {
    if (isOpened) {
        return;
    }

    isOpened = true;

    walletCover.style.removeProperty("transform");
    walletCover.style.removeProperty("transition");

    vcardContent.style.removeProperty("--card-scale");
    vcardContent.style.removeProperty("--card-position");
    vcardContent.style.removeProperty("--card-opacity");
    vcardContent.style.removeProperty("transition");

    walletCover.classList.add("opened");
    vcardContent.classList.add("visible");


       setTimeout(function () {
        vcardContent.classList.add("visible");

       setTimeout(function () {
        openBubble();
    }, 1000);
    }, 250);

    setTimeout(function () {
        walletBackground.classList.add("finished");
        walletCover.classList.add("finished");
    },700);
}
    /*
     * openable with space bar too, just in case.
     */
    walletCover.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openVCard();
        }
    });


    function updateWorkingStatus() {
        const statusDot = document.getElementById("statusDot");

        // Aktuelle Zeit in der deutschen Zeitzone
        const germanTime = new Date().toLocaleString("en-US", {
            timeZone: "Europe/Berlin"
        });

        const now = new Date(germanTime);

        // Sonntag = 0, Montag = 1, ..., Samstag = 6
        const weekday = now.getDay();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        const startTime = 9 * 60;  // 08:00 Uhr
        const endTime = 18 * 60;   // 17:00 Uhr

        const startTimeSaturday = 9 * 60;  // 09:00 Uhr
        const endTimeSaturday = 14 * 60;   // 14:00 Uhr

        const isWeekday = weekday >= 1 && weekday <= 5;
        const isSaturday = weekday === 6;

        const isWorkingTime =
            currentMinutes >= startTime &&
            currentMinutes < endTime;

        if (isWeekday && isWorkingTime || isSaturday && currentMinutes >= startTimeSaturday && currentMinutes < endTimeSaturday) {
            statusDot.classList.remove("bg-red-500");
            statusDot.classList.add("bg-green-500");
            statusDot.title = "Während der Arbeitszeit\nErreichbar";
            return true; // Erreichbar
        } else {
            statusDot.classList.remove("bg-green-500"); 
            statusDot.classList.add("bg-red-500");
            statusDot.title = "Außerhalb der Arbeitszeit\nNicht erreichbar";
            return false; // Nicht erreichbar
        }
    }

    updateWorkingStatus();

function positionHeadlightBeam() {
    const profileSection = document.getElementById("profil");
    const lightOrigin = document.getElementById("headlightOrigin");
    const profileTarget = document.getElementById("profileTrigger");
    const lightBeam = document.getElementById("headlightBeam");

    const sectionRect = profileSection.getBoundingClientRect();
    const originRect = lightOrigin.getBoundingClientRect();
    const targetRect = profileTarget.getBoundingClientRect();

    const startX =
        originRect.left - sectionRect.left + originRect.width / 2;

    const startY =
        originRect.top - sectionRect.top + originRect.height / 2;

   
    const targetX = targetRect.left - sectionRect.left;
    const targetY =
        targetRect.top - sectionRect.top + targetRect.height / 2;

    const differenceX = targetX - startX;
    const differenceY = targetY - startY;

    const distance = Math.sqrt(
        differenceX * differenceX +
        differenceY * differenceY
    );

    const angle =
        Math.atan2(differenceY, differenceX) * 180 / Math.PI;

    lightBeam.style.left = startX + "px";
    lightBeam.style.top = (startY - 45) + "px";
    lightBeam.style.width = distance + "px";
    lightBeam.style.transform = "rotate(" + angle + "deg)";
}
